org.gradle.warning.mode=all
org.gradle.console=verbose
# Required by the FTPS session-reuse implementation on Java 17+.
# Setting org.gradle.jvmargs replaces Gradle's default JVM arguments.
# Keep -Xmx512m to preserve its default maximum heap size.
org.gradle.jvmargs=-Xmx512m --add-opens=java.base/sun.security.ssl=ALL-UNNAMED --add-opens=java.base/sun.security.util=ALL-UNNAMED

# To use a local checkout, including uncommitted changes, run:
# ./gradlew --include-build /absolute/path/to/SubKt <task>
# Keep subktRepo and subktVersion set; they apply without --include-build.
subktRepo=https://github.com/Myaamori/SubKt.git
subktVersion=0.1.19
